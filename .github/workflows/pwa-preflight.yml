name: PWA offline and lexical preflight
on:
  pull_request:
  push:
    branches:
      - maintenance/kotoba-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check bootstrap.js
          node --check app.js
      - name: Verify offline shell and lexical IDs
        run: node scripts/check-pwa-preflight.cjs
