name: PWA offline and lexical preflight
on:
  pull_request:
  push:
    branches:
      - main
      - maintenance/kotoba-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JMdict audit script syntax
        run: python -m py_compile scripts/check-jmdict-current.py
      - name: Check 92-case read-only audit and synthetic schema tests
        run: |
          python -m py_compile scripts/review_jmdict_92.py
          python -m unittest discover -s tests -p test_jmdict_92.py -v
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check bootstrap.js
          node --check app.js
      - name: Verify offline shell and lexical IDs
        run: node scripts/check-pwa-preflight.cjs

  browser-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.61.0
          npx playwright install --with-deps chromium
      - name: Test first-install offline reload and IndexedDB continuity
        run: node scripts/test-pwa-offline.cjs

  public-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the deployed worker and required pages (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          base='https://naitsirc90.github.io/kotoba'
          ready=0
          for attempt in {1..18}; do
            if curl -fLsS --connect-timeout 10 --max-time 25 "$base/sw.js?verify=$GITHUB_SHA" | grep -q '3.1.17-license-recovery-20261118'; then ready=1; break; fi
            echo "Waiting for GitHub Pages deployment, attempt $attempt"
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then echo "Published service worker does not match validated hotfix"; exit 1; fi
          for file in index.html app.js bootstrap.js assets/data/vocabulary.json \
            licenses/KOTOBA_3_1_17_M2_PROVA_SOURCES.txt \
            licenses/KOTOBA_3_1_17_WIKTIONARY_REFERENCES.json \
            licenses/KOTOBA_3_1_17_LIVELLI_ATTRIBUZIONI.txt \
            licenses/KOTOBA_3_1_9_PORTABILITY.txt \
            licenses/LICENSE-CC-BY-SA-4.0.txt; do
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$base/$file?verify=$GITHUB_SHA")
            test "$code" = 200 || { echo "$file HTTP $code"; exit 1; }
            echo "PASS HTTP 200 $file"
          done
          echo 'PASS GitHub Pages published hotfix'
