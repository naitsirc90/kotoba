name: JMdict monthly upstream check (read-only)
on:
  schedule:
    - cron: '10 6 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-jmdict-current.py'
      - '.github/workflows/jmdict-monthly.yml'

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official JMdict and compare current distribution coverage
        run: python scripts/check-jmdict-current.py
